<div
  class="upload-card"
  [class.upload-card--dragging]="isDragging()"
  [class.upload-card--has-file]="!!selectedFile()"
  (dragenter)="onDragEnter($event)"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  @if (!selectedFile()) {
    <div class="upload-card__zone">
      <div class="upload-card__icon-wrap" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </div>

      <p class="upload-card__title">Drop your PDF here</p>
      <p class="upload-card__or">or</p>

      <label class="upload-card__browse">
        Browse files
        <input
          type="file"
          accept=".pdf,application/pdf"
          (change)="onFileInput($event)"
          class="visually-hidden"
        />
      </label>

      <p class="upload-card__hint">PDF files only · Max 5MB</p>

      @if (fileError()) {
        <div class="upload-card__error" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ fileError() }}
        </div>
      }
    </div>
  } @else {
    <div class="upload-card__preview">
      <div class="upload-card__file">
        <div class="upload-card__file-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <div class="upload-card__file-info">
          <span class="upload-card__file-name">{{ selectedFile()!.name }}</span>
          <span class="upload-card__file-size">{{ formatSize(selectedFile()!.size) }}</span>
        </div>
        <button class="upload-card__remove" (click)="clearFile()" aria-label="Remove selected file">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <button class="upload-card__submit" (click)="submit()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        Decode Document
      </button>
    </div>
  }
</div>
